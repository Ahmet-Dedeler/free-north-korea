# Weekly check of every upstream data source (see scripts/check-sources.mjs).
# Also re-downloads the sanctions lists (scripts/build-sanctions.ts) and refreshes the chart datasets in
# data/series (scripts/build-series.ts; each source group skips itself until its data is due, so most weeks only
# the market prices and the UN-list counts are fetched).
# Plain Node with no npm install (plus uv for the Sentinel-2 script); most weeks it takes a few minutes.
# Also copies new missile tests from upstream (scripts/sync-missiles.mjs), adds new Sentinel-2 images
# (scripts/sentinel/build.py) and refreshes Kim Watch from KCNA (scripts/build-kimwatch.ts).
# Commits data/sources/state.json, changes.json, data/sanctions.json and public/data when something changed, moved or broke,
# which also redeploys the site so /sources shows it.
name: Check sources

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-sources.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Refresh the UN and OFAC lists behind /sanctions. A failed download keeps last week's file.
      - run: node scripts/build-sanctions.ts || echo "sanctions refresh skipped"
      # New missile tests from nagix/nk-missile-tests (behind /missiles and the missile-launches chart).
      - run: node scripts/sync-missiles.mjs || echo "missile sync skipped"
      # pdftotext reads the Ministry of Unification defector PDF. A failed source keeps its previous series.
      - run: sudo apt-get install -y -qq --no-install-recommends poppler-utils > /dev/null
      - run: node scripts/build-series.ts || echo "series refresh skipped"
      # Camp Watch: new Sentinel-2 images of camps and nuclear/missile sites. A failed site keeps its images.
      - uses: astral-sh/setup-uv@v6
      - run: timeout 25m uv run scripts/sentinel/build.py || echo "sentinel refresh skipped"
      # Kim Watch, full run including KCNA's site search (letters and messages). The event wire does a quick daily one.
      - run: timeout 20m node scripts/build-kimwatch.ts || echo "kim watch refresh skipped"
      - name: Commit if anything changed
        run: |
          git config user.name "source-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources data/sanctions.json data/series public/data data/sentinel.json data/sentinel docs/watch public/img/sentinel data/kimwatch.json data/raw/kcna
          git diff --cached --quiet && exit 0
          git commit -m "Source watch: $(date -u +%F)"
          git pull --rebase origin main && git push
